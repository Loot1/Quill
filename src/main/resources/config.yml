menus:
  global:
    items:
      close: '&cQuitter'
      previous-page: '&7Page précédente'
      next-page: '&7Page suivante'
  all-players:
    # %size% -> Total size of player archived books on the server
    title: '&7Candidatures archivées (%size%)'
    items:
      player-head:
        # %player% -> Author name
        # %title% -> Book title
        name: '&6%player%'
        # %player% -> Author name
        # %title% -> Book title
        # %date% -> Date of creation
        # %status% -> Book status
        # %pages% -> Pages number
        lore:
          - '&7Titre : %title%'
          - '&7Date : &d%date%'
          - '&7Status : &b%status%'
          - '&7Pages : &b%pages%'
  player:
    # %player% -> Player name
    # %size% -> Total size of player deaths on the server
    title: '&7Candidatures archivées de &6%player%&7 (%size%)'
    items:
      book:
        # %title% -> Book title
        name: '&b%title%'
        # %date% -> Date of creation
        # %status% -> Book status
        # %pages% -> Pages number
        lore:
          - '&7Date : &d%date%'
          - '&7Status : &b%status%'
          - '&7Pages : &b%pages%'

