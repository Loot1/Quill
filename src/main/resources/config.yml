messages:
  configuration-reload: '&7La configuration a été rechargé.'
  # %author% -> Author name
  # %title% -> Book title
  book-archived: '&7Le livre &b%title%&7 écrit par &6%author%&7 a été archivé.'
  errors:
    permission-denied: '&cVous n''avez pas la permission.'
    console-sender: '&cCette commande n''est pas utilisable depuis la console.'
    no-book: '&cAucun livre n''est enregistrée sur le serveur.'
